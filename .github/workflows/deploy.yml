name: Deploy to Odoo server

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-odoo-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Pull, upgrade changed modules, restart Odoo
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute changed modules
        id: changed
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "push" ]; then
            echo "modules=auto" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          BEFORE="${{ github.event.before }}"
          if [ -z "$BEFORE" ] || ! git cat-file -e "${BEFORE}^{commit}" 2>/dev/null; then
            echo "modules=auto" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          MODULES="$(git diff --name-only "$BEFORE" "${{ github.sha }}" \
            | awk -F/ '{print $1}' | sort -u \
            | while read -r d; do
                  if [ -f "$d/__manifest__.py" ]; then echo "$d"; fi
              done \
            | tr '\n' ',' | sed 's/,$//')"
          echo "modules=$MODULES" >> "$GITHUB_OUTPUT"

      - name: Set up SSH key
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Deploy over SSH (retry x3)
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_USER: ${{ secrets.SSH_USER }}
          SSH_PORT: ${{ secrets.SSH_PORT || 22 }}
          MODULES: ${{ steps.changed.outputs.modules }}
        run: |
          set -uo pipefail
          for attempt in 1 2 3; do
            echo "::group::Deploy attempt $attempt"
            if ssh -i "$HOME/.ssh/deploy_key" \
                 -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
                 -o ConnectTimeout=60 \
                 -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
                 "DEPLOY_MODULES='$MODULES' bash -s" < deploy/remote.sh; then
              echo "::endgroup::"
              echo "Deploy succeeded on attempt $attempt"
              exit 0
            fi
            echo "::endgroup::"
            echo "Attempt $attempt failed"
            sleep 20
          done
          echo "Deploy failed after 3 attempts"
          exit 1
